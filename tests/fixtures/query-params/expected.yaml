apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: query-params
spec:
  parentRefs:
    - name: my-gateway
  rules:
    - matches:
        - path:
            type: Exact
            value: '/items'
          queryParams:
            - name: q
              type: RegularExpression
              value: '.+'
