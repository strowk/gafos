apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: header-params
spec:
  parentRefs:
    - name: my-gateway
  rules:
    - matches:
        - path:
            type: Exact
            value: '/items'
          headers:
            - name: X-Api-Key
              type: RegularExpression
              value: '.+'
